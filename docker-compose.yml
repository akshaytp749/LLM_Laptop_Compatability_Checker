services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
      # Reach the Ollama instance running on the Docker host.
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      # Required on Linux; a no-op on Docker Desktop (Windows/macOS).
      - "host.docker.internal:host-gateway"
    # NOTE: GPU detection (pynvml) inside the container requires the NVIDIA
    # Container Toolkit. Uncomment to enable:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      # Vite dev-server proxies /api to the backend container.
      - VITE_PROXY_TARGET=http://backend:5000
    depends_on:
      - backend
